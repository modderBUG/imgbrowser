<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>登录 · IMG BROWSER</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-shell">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="m21 15-5-5L5 21"/>
          </svg>
        </span>
        <h1>IMG BROWSER</h1>
        <p>私有图片库，请输入访问密码</p>
      </div>

      <div class="field">
        <label for="password">访问密码</label>
        <div class="input-wrap">
          <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus
                 aria-describedby="loginError" placeholder="请输入访问密码">
          <button type="button" class="reveal" id="togglePassword" aria-label="显示密码" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="error" id="loginError" role="alert" hidden></p>

      <button class="submit" type="submit" id="submitBtn">登录</button>

      <p class="hint">
        密码由管理员通过 <code>APP_PASSWORD</code> 环境变量配置<br>
        连续输错 5 次会锁定 15 分钟
      </p>
    </form>
  </main>

  <script src="/login.js"></script>
</body>
</html>
