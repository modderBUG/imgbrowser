<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片浏览 - 瀑布流展示</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-top">
                <h1><i class="fas fa-images"></i> IMG BROWSER</h1>
          <button id="logoutBtn" class="logout-btn" title="登出" aria-label="退出登录">
                     <i class="fas fa-sign-out-alt"></i> LOGOUT
                 </button>
            </div>
            <p class="subtitle">Visual Experience Redefined</p>
            <div class="stats">
                <span id="total-images">0 IMAGES</span>
                <span id="loaded-count">LOADED 0</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="view-options" role="group" aria-label="视图模式">
                <button class="btn active" data-view="waterfall" aria-label="瀑布流视图" role="radio" aria-checked="true"><i class="fas fa-th"></i> WATERFALL</button>
                <button class="btn" data-view="grid" aria-label="网格视图" role="radio" aria-checked="false"><i class="fas fa-grid"></i> GRID</button>
                <button class="btn" data-view="list" aria-label="列表视图" role="radio" aria-checked="false"><i class="fas fa-list"></i> LIST</button>
            </div>
            <div class="nav-tabs" role="tablist" aria-label="图片分类">
                <button class="tab-btn active" data-show="all" aria-label="所有图片" role="tab" aria-selected="true"><i class="fas fa-images"></i> ALL</button>
                <button class="tab-btn" data-show="favorites" aria-label="收藏的图片" role="tab" aria-selected="false"><i class="fas fa-heart"></i> FAVORITES</button>
                <button class="tab-btn" data-show="deleted" aria-label="回收站" role="tab" aria-selected="false"><i class="fas fa-trash"></i> TRASH</button>
            </div>
            <div class="sort-options">
                <label for="sort">SORT BY:</label>
                <select id="sort" aria-label="排序方式">
                    <option value="name">NAME</option>
                    <option value="newest">NEWEST</option>
                    <option value="oldest">OLDEST</option>
                </select>
            </div>
        </div>

        <div id="gallery" class="gallery waterfall">
            <!-- 图片将通过 JS 动态插入 -->
        </div>

        <div id="loading" class="loading">
            <p>LOADING MORE IMAGES...</p>
        </div>

        <div id="end-message" class="end-message">
            <p><i class="fas fa-flag-checkered"></i> ALL IMAGES LOADED</p>
        </div>

        <!-- 大图查看模态框 -->
        <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-labelledby="modal-filename">
            <div class="modal-content">
                <button class="modal-close" aria-label="关闭"><i class="fas fa-times"></i></button>
                <div class="modal-image-container">
                    <img id="modal-image" src="" alt="">
                    <div class="modal-controls">
                         <button class="modal-btn prev-btn" aria-label="上一张"><i class="fas fa-chevron-left"></i></button>
                         <button class="modal-btn next-btn" aria-label="下一张"><i class="fas fa-chevron-right"></i></button>
                         <button class="modal-btn favorite-btn" aria-label="收藏"><i class="fas fa-heart"></i></button>
                         <button class="modal-btn delete-btn" aria-label="删除"><i class="fas fa-trash"></i></button>
                         <button class="modal-btn zoom-btn" aria-label="放大"><i class="fas fa-search-plus"></i></button>
                     </div>
                </div>
                <div class="modal-info">
                    <h3 id="modal-filename"></h3>
                    <p id="modal-details"></p>
                </div>
            </div>
        </div>

        <div class="back-to-top">
            <button id="backToTop" class="btn-top" aria-label="返回顶部"><i class="fas fa-chevron-up"></i></button>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>BUILT WITH TYPESCRIPT + NODE.JS • IMAGES FROM <code>IMAGES/</code> DIRECTORY</p>
            <p class="links">
                <a href="/api/images" target="_blank"><i class="fas fa-code"></i> API DOCS</a>
                <a href="https://github.com" target="_blank"><i class="fab fa-github"></i> GITHUB</a>
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
